name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: "20"

jobs:
  # 前端:vue-tsc 类型检查 + vite 构建;顺带守住 opencode 插件副本同步
  frontend:
    name: 前端 (vue-tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: opencode 插件副本必须与源文件一致
        run: cmp adapters/opencode-plugin/kvba-plugin.ts .opencode/plugins/kvba-plugin.ts

      - name: Trae hook 语法与配置模板校验
        run: |
          node --check adapters/trae-hook/kvba-trae-hook.mjs
          node -e "JSON.parse(require('fs').readFileSync('adapters/trae-hook/hooks.sample.json','utf8'))"

      - name: 类型检查与构建
        run: npm run build

  # opencode 插件是独立于前端的 TS 产物,单独给出信号
  opencode-plugin:
    name: opencode 插件类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装类型依赖
        run: npm install --no-save --no-audit --no-fund typescript@5.7.3 @types/node@22 "@opencode-ai/plugin@^1"

      - name: tsc --noEmit
        run: >
          npx tsc --noEmit --strict --skipLibCheck
          --target es2022 --module esnext --moduleResolution bundler
          --types node adapters/opencode-plugin/kvba-plugin.ts

  # Rust:主程序 + claude-code 适配器,三平台
  rust:
    name: Rust (核心 + 适配器 / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖 (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            adapters/claude-code

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: clippy — 主程序
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 单元测试 — 主程序
        working-directory: src-tauri
        run: cargo test --locked

      - name: cargo fmt --check — claude-code 适配器
        working-directory: adapters/claude-code
        run: cargo fmt --all --check

      - name: clippy — claude-code 适配器
        working-directory: adapters/claude-code
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 单元测试 — claude-code 适配器
        working-directory: adapters/claude-code
        run: cargo test --locked

